name: Release

# main への push で:
# 1. 未リリースの changeset があれば「バージョンを上げる PR」を作る（changesets/action）
# 2. 未処理の changeset がなく（= バージョン PR がマージされた後）、package.json のバージョンが npm に未公開なら、Trusted Publishing（OIDC）で provenance 付きで公開し、
#    タグを打ち、MCP Registry にも公開する
# npm のトークンは置かない。初回だけは手作業が必要（docs/release.md）。

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # タグとバージョン PR
      pull-requests: write # バージョン PR
      id-token: write # npm Trusted Publishing / provenance と MCP Registry の OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # 公開の権限（id-token）を持つジョブなので、依存のキャッシュは使わない（キャッシュ経由の汚染を避ける）
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Create version PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          version-script: pnpm version-packages
          pr-title: "chore: release"
          commit-message: "chore: release"

      # 未処理の changeset があると、上のステップで作業ツリーのバージョンが上がっている。
      # その状態で公開すると未リリースの版が出てしまうので、changeset がないときだけ公開を検討する
      - name: Check whether this version is published
        if: steps.changesets.outputs.has-changesets == 'false'
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "0.0.0" ] || npm view "kintai-plus-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (Trusted Publishing + provenance)
        if: steps.check.outputs.publish == 'true'
        run: |
          npm install -g npm@12.2.1
          npm publish --provenance --access public

      - name: Tag release
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"

      # 公開直後は npm に新しい版がまだ見えず、MCP Registry の検証が 404 で失敗するので、見えるまで待つ。
      # 段階的公開（staged publishing）で承認待ちになった場合はここで失敗する。承認後に手元で
      # `mcp-publisher login github && mcp-publisher publish` を実行する（docs/release.md）
      - name: Wait for the version on npm
        if: steps.check.outputs.publish == 'true'
        run: |
          for i in $(seq 1 30); do
            if npm view "kintai-plus-mcp@${{ steps.check.outputs.version }}" version >/dev/null 2>&1; then
              echo "kintai-plus-mcp@${{ steps.check.outputs.version }} is visible on npm"
              exit 0
            fi
            echo "Waiting for kintai-plus-mcp@${{ steps.check.outputs.version }} on npm ($i/30)"
            sleep 10
          done
          echo "kintai-plus-mcp@${{ steps.check.outputs.version }} did not appear on npm. If it is waiting for staged-publishing approval, approve it and register it in the MCP Registry by hand."
          exit 1

      - name: Publish to MCP Registry
        if: steps.check.outputs.publish == 'true'
        run: |
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz"
          echo "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
